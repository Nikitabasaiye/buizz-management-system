map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream client_upstream { server client:3000; keepalive 32; }
upstream api_upstream { server api:5000; keepalive 32; }
upstream admin_upstream { server admin-api:5001; keepalive 16; }

server {
  listen 80;
  server_name buizz.com www.buizz.com api.buizz.com admin-api.buizz.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name buizz.com www.buizz.com;
  ssl_certificate /etc/letsencrypt/live/buizz.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buizz.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://client_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 443 ssl http2;
  server_name api.buizz.com;
  ssl_certificate /etc/letsencrypt/live/buizz.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buizz.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl http2;
  server_name admin-api.buizz.com;
  ssl_certificate /etc/letsencrypt/live/buizz.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/buizz.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://admin_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
