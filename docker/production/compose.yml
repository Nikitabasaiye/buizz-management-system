name: buizz-production

x-common: &common
  restart: unless-stopped
  networks:
    - buizz
  logging:
    driver: awslogs
    options:
      awslogs-region: ${AWS_REGION}
      awslogs-group: /buizz/production/containers
      awslogs-create-group: "true"

services:
  client:
    <<: *common
    image: ${ECR_REGISTRY}/buizz-client:${IMAGE_TAG}
    env_file: env/client.env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/_buizz/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  api:
    <<: *common
    image: ${ECR_REGISTRY}/buizz-api:${IMAGE_TAG}
    env_file: env/server.env
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *common
    image: ${ECR_REGISTRY}/buizz-api:${IMAGE_TAG}
    command: ["node", "worker.js"]
    env_file: env/worker.env
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  admin-api:
    <<: *common
    image: ${ECR_REGISTRY}/buizz-admin:${IMAGE_TAG}
    env_file: env/admin.env
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    depends_on:
      client:
        condition: service_healthy
      api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

networks:
  buizz:
    driver: bridge
