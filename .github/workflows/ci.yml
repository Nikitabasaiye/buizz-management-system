name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  node-services:
    strategy:
      matrix:
        include:
          - directory: server
            node: 22
          - directory: admin
            node: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - name: Syntax check application JavaScript
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          tags: buizz-client:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.buizz.com
            NEXT_PUBLIC_ADMIN_API_BASE_URL=https://admin-api.buizz.com
            NEXT_PUBLIC_SITE_URL=https://www.buizz.com
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          tags: buizz-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: admin
          push: false
          tags: buizz-admin:ci
