name: Deploy production

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          - name: Debug variables
  run: |
    echo "Repository: ${{ github.repository }}"
    echo "Event: ${{ github.event_name }}"
    echo "Ref: ${{ github.ref }}"
    echo "Environment: production"
    echo "AWS Region: ${{ vars.AWS_REGION }}"
    echo "Role ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3

      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/buizz-client:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.buizz.com
            NEXT_PUBLIC_ADMIN_API_BASE_URL=https://admin-api.buizz.com
            NEXT_PUBLIC_SITE_URL=https://www.buizz.com

      - name: Build and push API and worker image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/buizz-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push admin API
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/buizz-admin:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Deploy through Systems Manager
        id: ssm
        shell: bash
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Buizz ${{ env.IMAGE_TAG }}" \
            --parameters commands="sudo AWS_REGION=${{ vars.AWS_REGION }} bash /opt/buizz/repository/scripts/deploy-production.sh ${{ env.IMAGE_TAG }}" \
            --query Command.CommandId --output text)"
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "${command_id}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

      - name: Show deployment output
        if: always() && steps.ssm.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
